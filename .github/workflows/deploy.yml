# Publishes the page to presentation.meohealth.com on every push to main.
# Needs the repo secret CLOUDFLARE_API_TOKEN (Cloudflare token with "Edit Cloudflare Workers").
name: Publish
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: publish
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.166.0"
          command: deploy
